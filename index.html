<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صراحة ولا ضربة؟ 😂🎡 - لعبة صحاب القسم</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f0a1c;
            --card-bg: #1a1233;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f3f4f6;
            --neon-glow: 0 0 15px rgba(236, 72, 153, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 20px 10px;
            width: 100%;
            background: rgba(26, 18, 51, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(245, 158, 11, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-gold), var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--neon-glow);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #a7f3d0;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Views management */
        .view {
            width: 100%;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Styling */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Player Setup View */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid var(--accent-purple);
            background: rgba(15, 10, 28, 0.7);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-pink);
            box-shadow: var(--neon-glow);
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent-purple), var(--accent-pink));
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn-gold {
            background: linear-gradient(45deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            margin-top: 10px;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }

        .player-tag {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent-purple);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .player-tag i {
            cursor: pointer;
            color: var(--accent-red);
        }

        /* Wheel View */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }

        @media (min-width: 500px) {
            .wheel-container {
                width: 400px;
                height: 400px;
            }
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), inset 0 0 15px rgba(0,0,0,0.5);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent-gold);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        /* Scoreboard */
        .scoreboard {
            width: 100%;
            background: rgba(15, 10, 28, 0.6);
            border-radius: 15px;
            padding: 10px 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-item {
            text-align: center;
            font-size: 0.9rem;
        }

        .score-item span.name {
            color: #d1d5db;
        }

        .score-item span.points {
            color: var(--accent-gold);
            font-weight: bold;
            margin-right: 5px;
        }

        /* Modals & Dialogs */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
            text-align: center;
            position: relative;
        }

        .selected-player-title {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        /* Action Choice Buttons */
        .action-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .btn-action {
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 15px;
            color: white;
            text-align: right;
            padding-right: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-truth {
            background: linear-gradient(45deg, #10b981, #059669);
        }

        .btn-dare {
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }

        .btn-pass {
            background: linear-gradient(45deg, #6b7280, #4b5563);
        }

        /* Filters & Levels */
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .level-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            opacity: 0.6;
        }

        .level-badge.active {
            opacity: 1;
            border-color: white;
            font-weight: bold;
        }

        .lvl-easy { background: var(--accent-green); color: white; }
        .lvl-bold { background: var(--accent-gold); color: black; }
        .lvl-deep { background: var(--accent-red); color: white; }

        /* Question Box Display */
        .question-box {
            background: rgba(15, 10, 28, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            border: 1px dashed var(--accent-pink);
            font-size: 1.3rem;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .voting-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .vote-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .vote-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Top Nav controls */
        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
        }

        .sound-toggle {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Questions Manager Modal */
        .question-list-admin {
            max-height: 300px;
            overflow-y: auto;
            text-align: right;
            margin-top: 15px;
        }

        .q-item {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .category-tab {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .tab-btn {
            white-space: nowrap;
            padding: 6px 12px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #ccc;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>صراحة ولا ضربة؟ 😂🎡</h1>
        <p class="subtitle">لعبة الصراحة والتحديات الممتعة لأصدقاء القسم</p>
    </header>

    <div class="container">
        <!-- Navigation Controls -->
        <div class="top-nav">
            <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">
                <i class="fas fa-volume-up" id="soundIcon"></i>
            </button>
            <div>
                <button class="btn-secondary" onclick="openQuestionsAdmin()" style="font-size: 0.9rem; padding: 6px 12px;">
                    <i class="fas fa-edit"></i> بنك الأسئلة
                </button>
                <button class="btn-secondary" onclick="resetGame()" style="font-size: 0.9rem; padding: 6px 12px;">
                    <i class="fas fa-redo"></i> اعادة اللعب
                </button>
            </div>
        </div>

        <!-- VIEW 1: PLAYER SETUP -->
        <div id="setupView" class="view active">
            <div class="card">
                <h2 style="margin-bottom: 15px; text-align: center;"><i class="fas fa-users"></i> إدخال أسماء اللاعبين</h2>
                <div class="input-group">
                    <input type="text" id="playerNameInput" placeholder="أدخل اسم اللاعب (مثلاً: أسامة، مريم)..." onkeypress="handleKeyPress(event)">
                    <button class="btn-primary" onclick="addPlayer()"><i class="fas fa-plus"></i> إضافة</button>
                </div>

                <div class="player-list" id="playerList">
                    <!-- Dynamic player tags -->
                </div>

                <button class="btn-gold" onclick="startGame()">
                    ابدأ اللعب الآن! <i class="fas fa-play-circle"></i>
                </button>
            </div>
        </div>

        <!-- VIEW 2: THE WHEEL -->
        <div id="wheelView" class="view">
            <div class="card" style="text-align: center;">
                <h2>دور العجلة يا أستاذ! 🎡</h2>
                
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>

                <button class="btn-gold" id="spinBtn" onclick="spinWheel()">
                    دوّر العجلة! 🚀
                </button>

                <!-- Scoreboard displaying registered players -->
                <div class="scoreboard" id="scoreboard">
                    <!-- Dynamic scores -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 1: PLAYER ACTION SELECTION (TRUTH OR DARE) -->
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <h3 class="selected-player-title" id="selectedPlayerName">أحمد</h3>
            <p style="font-size: 1.1rem; margin-bottom: 15px;">جاء الدور عليك! أشنو غتختار؟</p>

            <div class="level-selector">
                <span class="level-badge lvl-easy active" onclick="setLevel('easy', this)">خفيف 🟢</span>
                <span class="level-badge lvl-bold" onclick="setLevel('bold', this)">جريء 🟠</span>
                <span class="level-badge lvl-deep" onclick="setLevel('deep', this)">حساس 🔴</span>
            </div>

            <div class="action-options">
                <button class="btn-action btn-truth" onclick="chooseAction('truth')">
                    <span>اعترف 🎤 (صراحة)</span>
                    <i class="fas fa-comment-dots"></i>
                </button>
                <button class="btn-action btn-dare" onclick="chooseAction('dare')">
                    <span>تحدّي 😂 (ضربة)</span>
                    <i class="fas fa-fire"></i>
                </button>
                <button class="btn-action btn-pass" onclick="chooseAction('pass')">
                    <span>مرّر الدور ⏭️</span>
                    <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: QUESTION / DARE DISPLAY -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <h3 id="modalPlayerTitle" style="color: var(--accent-pink);">دور: أحمد</h3>
            <span id="typeBadge" class="level-badge lvl-easy" style="opacity: 1; display: inline-block; margin: 10px 0;">صراحة</span>

            <div class="question-box" id="questionText">
                جاري جلب السؤال...
            </div>

            <div class="voting-section">
                <button class="vote-btn" onclick="addPoints(1)"><i class="fas fa-thumbs-up"></i> إجابة ناضية (+1)</button>
                <button class="vote-btn" onclick="addPoints(2)"><i class="fas fa-laugh-squint"></i> قتلتنا بالضحك (+2)</button>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn-secondary" onclick="nextRandomQuestion()">سؤال آخر 🔄</button>
                <button class="btn-primary" onclick="closeQuestionModal()">تم التنفيذ / كمل اللعب ➡️</button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: QUESTIONS BANK ADMIN -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 650px;">
            <h3 style="margin-bottom: 15px;">إدارة بنك الأسئلة والتحديات 📝</h3>
            
            <div class="category-tab" id="categoryTabs">
                <!-- Category tabs will be rendered here -->
            </div>

            <div class="input-group">
                <input type="text" id="newQuestionInput" placeholder="أضف سؤالاً جديداً أو تحدياً...">
                <button class="btn-primary" onclick="addNewQuestion()"><i class="fas fa-plus"></i></button>
            </div>

            <div class="question-list-admin" id="adminQuestionsList">
                <!-- Dynamic Questions -->
            </div>

            <button class="btn-secondary" onclick="closeAdminModal()" style="margin-top: 15px; width: 100%;">إغلاق</button>
        </div>
    </div>

    <script>
        /* ==================== GAME INITIAL STATE & BANK ==================== */
        const DEFAULT_QUESTIONS = {
            "شكون أكثر واحد؟": [
                { t: "شكون أكثر واحد عصبي فينا؟", l: "easy" },

                { t: "شكون أكثر واحد كيدير فيها فاهم وهو ما فاهم والو؟", l: "easy" },
                { t: "شكون أكثر واحد كيتبدل وجهو ملي كيشوف شي واحد؟", l: "bold" },
                { t: "شكون أكثر واحد كيدير المشاكل؟", l: "easy" },
                { t: "شكون أكثر واحد مشهور فالقسم؟", l: "easy" },
                { t: "شكون أكثر واحد محبوب عند الجميع؟", l: "easy" },

        /* ==================== WHEEL LOGIC ==================== */
        let wheelAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const numSegments = players.length;
            const arc = (2 * Math.PI) / numSegments;
            const colors = ['#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#6366f1'];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const center = canvas.width / 2;
            const radius = center - 10;

            for(let i = 0; i < numSegments; i++) {
                const angle = wheelAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + arc);
                ctx.lineTo(center, center);
                ctx.fill();
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Tajawal';
                ctx.fillText(players[i], radius - 30, 10);
                ctx.restore();
            }
        }

        function spinWheel() {
            if(isSpinning || players.length === 0) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const spinAngle = Math.random() * 2000 + 3000; // random full rotations + offset
            const duration = 3000;
            const startTimestamp = performance.now();
            const initialAngle = wheelAngle;

            function animateSpin(now) {
                const elapsed = now - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                wheelAngle = initialAngle + (spinAngle * easeProgress * Math.PI / 180);
                drawWheel();

                if(progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    determineWinner();
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function determineWinner() {
            const numSegments = players.length;
            const arc = (2 * Math.PI) / numSegments;
            // Normalize angle
            const normalizedAngle = (2 * Math.PI - (wheelAngle % (2 * Math.PI))) % (2 * Math.PI);
            // Pointer is at top (- Math.PI / 2 or 3*Math.PI/2 relative to standard start)
            // Let's compute based on standard top pointer calculation:
            const pointerAngle = (3 * Math.PI / 2 - wheelAngle) % (2 * Math.PI);
            const positivePointerAngle = (pointerAngle + 2 * Math.PI) % (2 * Math.PI);
            
            const winningIndex = Math.floor(positivePointerAngle / arc) % numSegments;
            currentPlayer = players[winningIndex];

            // Show Action Choice Modal
            document.getElementById('selectedPlayerName').innerText = currentPlayer;
            document.getElementById('actionModal').classList.add('active');

            if(soundEnabled) playSoundEffect();
        }

        function loadRandomQuestion() {
            // Flatten or select from all questions matching current level or category, ensuring non-repeating
            let allQList = [];
            for(let cat in questionsBank) {
                questionsBank[cat].forEach(q => {
                    if(q.l === currentLevel) {
                        allQList.push({ ...q, category: cat });
                    }
                });
            }

            if(allQList.length === 0) {
                // Fallback to any questions if level match is empty
                for(let cat in questionsBank) {
                    questionsBank[cat].forEach(q => allQList.push({ ...q, category: cat }));
                }
            }

            // Filter out already used questions if possible
            if(!usedQuestionsIndices[currentLevel]) {
                usedQuestionsIndices[currentLevel] = [];
            }

            let availableQuestions = allQList.filter((q, idx) => !usedQuestionsIndices[currentLevel].includes(q.t));

            // If all questions of this level have been used, reset the tracker for this level so questions don't permanently dry up
            if(availableQuestions.length === 0) {
                usedQuestionsIndices[currentLevel] = [];
                availableQuestions = allQList;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const selectedQ = availableQuestions[randomIndex];

            // Mark as used
            usedQuestionsIndices[currentLevel].push(selectedQ.t);
            saveState();

            document.getElementById('questionText').innerText = selectedQ.t;
        }

        function nextRandomQuestion() {
            loadRandomQuestion();
        }

        function addPoints(pts) {
            if(currentPlayer && scores[currentPlayer] !== undefined) {
                scores[currentPlayer] += pts;
                updateScoreboard();
                saveState();
                alert(`تم إضافة ${pts} نقاط لـ ${currentPlayer} 🌟`);
            }
        }

        function closeQuestionModal() {
            document.getElementById('questionModal').classList.remove('active');
        }

        function updateScoreboard() {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = '';
            players.forEach(p => {
                const item = document.createElement('div');
                item.className = 'score-item';
                item.innerHTML = `<span class="name">${p}:</span> <span class="points">${scores[p] || 0}</span> نقاط`;
                scoreboard.appendChild(item);
            });
        }

        /* ==================== QUESTIONS ADMIN MODAL ==================== */
        function openQuestionsAdmin() {
            renderCategoryTabs();
            renderAdminQuestions();
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            Object.keys(questionsBank).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${cat === activeAdminCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeAdminCategory = cat;
                    renderCategoryTabs();
                    renderAdminQuestions();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderAdminQuestions() {
            const listContainer = document.getElementById('adminQuestionsList');
            listContainer.innerHTML = '';
            const qList = questionsBank[activeAdminCategory] || [];
            
            qList.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'q-item';
                item.innerHTML = `
                    <span>${q.t} (${q.l})</span>
                    <button class="btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteQuestion('${activeAdminCategory}', ${index})"><i class="fas fa-trash"></i></button>
                `;
                listContainer.appendChild(item);
            });
        }

        function addNewQuestion() {
            const input = document.getElementById('newQuestionInput');
            const val = input.value.trim();
            if(val) {
                if(!questionsBank[activeAdminCategory]) {
                    questionsBank[activeAdminCategory] = [];
                }
                questionsBank[activeAdminCategory].push({ t: val, l: currentLevel });
                input.value = '';
                renderAdminQuestions();
                localStorage.setItem('class_game_questions', JSON.stringify(questionsBank));
            }
        }

        function deleteQuestion(cat, index) {
            questionsBank[cat].splice(index, 1);
            renderAdminQuestions();
            localStorage.setItem('class_game_questions', JSON.stringify(questionsBank));
        }

        /* ==================== SOUND EFFECT (Web Audio API) ==================== */
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        function playSoundEffect() {
            if(!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {
                // AudioContext not allowed or supported without user gesture
            }
        }
    </script>
</body>
</html>
